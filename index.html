<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三目並べ | Tic-Tac-Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1a1a2e; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px 12px;
  }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .sub { color: #888; margin-bottom: 20px; font-size: 0.9rem; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 0.95rem;
    background: #16213e; color: #eee;
    border: 2px solid #0f3460; border-radius: 10px;
    padding: 8px 16px; cursor: pointer; transition: all 0.15s;
  }
  button:hover { background: #0f3460; }
  button.active { background: #e94560; border-color: #e94560; }
  #status { font-size: 1.25rem; margin: 12px 0; min-height: 2rem; font-weight: bold; }
  #board {
    display: grid; grid-template-columns: repeat(3, 96px); grid-template-rows: repeat(3, 96px);
    gap: 8px; margin-bottom: 16px;
  }
  .cell {
    background: #16213e; border: 2px solid #0f3460; border-radius: 12px;
    font-size: 3rem; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .cell:hover:empty { background: #1f2d50; }
  .cell.x { color: #53d8fb; }
  .cell.o { color: #e94560; }
  .cell.win { background: #e94560; border-color: #e94560; }
  .cell.win.x, .cell.win.o { color: #fff; }
  #score { display: flex; gap: 24px; margin-bottom: 16px; font-size: 1rem; color: #aaa; }
  #score b { color: #eee; }
  #reset { font-size: 1.05rem; padding: 10px 28px; }
  .hint { color: #666; font-size: 0.8rem; margin-top: 14px; }
</style>
</head>
<body>
  <h1>⭕ 三目並べ ❌</h1>
  <div class="sub">Tic-Tac-Toe — built by Vincent &amp; Jolly 🐷</div>

  <div class="controls" id="modeControls">
    <button data-mode="pvp" class="active">ふたりで対戦</button>
    <button data-mode="cpu">コンピュータと対戦</button>
  </div>
  <div class="controls" id="diffControls" style="display:none">
    <button data-diff="easy" class="active">かんたん</button>
    <button data-diff="hard">つよい</button>
  </div>

  <div id="status">X の番です</div>
  <div id="board"></div>

  <div id="score">
    <span>X の勝ち: <b id="sx">0</b></span>
    <span>O の勝ち: <b id="so">0</b></span>
    <span>引き分け: <b id="sd">0</b></span>
  </div>
  <button id="reset">もう一回！</button>
  <div class="hint">X が先手です / X goes first</div>

<script>
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const modeControls = document.getElementById('modeControls');
const diffControls = document.getElementById('diffControls');
let cells, turn, over, mode = 'pvp', diff = 'easy';
let score = { X: 0, O: 0, D: 0 };
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function init() {
  cells = Array(9).fill('');
  turn = 'X'; over = false;
  board.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.i = i;
    c.addEventListener('click', () => play(i));
    board.appendChild(c);
  }
  setStatus('X の番です');
}

function setStatus(t) { statusEl.textContent = t; }

function winner(b) {
  for (const [a, c, d] of WINS) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { p: b[a], line: [a, c, d] };
  }
  return b.includes('') ? null : { p: 'D', line: [] };
}

function play(i) {
  if (over || cells[i]) return;
  move(i, turn);
  if (checkEnd()) return;
  turn = turn === 'X' ? 'O' : 'X';
  if (mode === 'cpu' && turn === 'O' && !over) {
    setStatus('コンピュータ考え中…');
    setTimeout(() => { move(cpuMove(), 'O'); if (!checkEnd()) { turn = 'X'; setStatus('X の番です'); } }, 350);
  } else {
    setStatus(turn + ' の番です');
  }
}

function move(i, p) {
  cells[i] = p;
  const el = board.children[i];
  el.textContent = p;
  el.classList.add(p.toLowerCase());
}

function checkEnd() {
  const w = winner(cells);
  if (!w) return false;
  over = true;
  if (w.p === 'D') { score.D++; setStatus('引き分け！'); }
  else {
    score[w.p]++;
    w.line.forEach(i => board.children[i].classList.add('win'));
    setStatus(w.p + ' の勝ち！🎉');
  }
  updateScore();
  return true;
}

function updateScore() {
  document.getElementById('sx').textContent = score.X;
  document.getElementById('so').textContent = score.O;
  document.getElementById('sd').textContent = score.D;
}

function cpuMove() {
  const empty = cells.map((v, i) => v ? null : i).filter(v => v !== null);
  if (diff === 'easy') return empty[Math.floor(Math.random() * empty.length)];
  // hard: minimax, O maximizes
  let best = -Infinity, bi = empty[0];
  for (const i of empty) {
    cells[i] = 'O';
    const s = minimax(cells, false);
    cells[i] = '';
    if (s > best) { best = s; bi = i; }
  }
  return bi;
}

function minimax(b, isMax) {
  const w = winner(b);
  if (w) return w.p === 'O' ? 1 : w.p === 'X' ? -1 : 0;
  let best = isMax ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = isMax ? 'O' : 'X';
    const s = minimax(b, !isMax);
    b[i] = '';
    best = isMax ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}

modeControls.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  [...modeControls.children].forEach(x => x.classList.toggle('active', x === b));
  diffControls.style.display = mode === 'cpu' ? 'flex' : 'none';
  init();
});
diffControls.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  diff = b.dataset.diff;
  [...diffControls.children].forEach(x => x.classList.toggle('active', x === b));
  init();
});
document.getElementById('reset').addEventListener('click', init);
init();
</script>
</body>
</html>
